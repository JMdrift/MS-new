<script>
  // JEDNORAZOVE zmereni skutecne viditelne vysky okna do CSS promenne.
  // DUVOD: 100vh/100dvh/100svh samotne obcas na realnem iPhonu ve
  // standalone PWA rezimu nedosahnou uplne dolu (zbyde proužek pozadi
  // <body> pod appkou). Toto NENI totez jako drivejsi "sledovani
  // klavesnice" pres visualViewport (to zpusobovalo regrese - viz
  // komentar v main.js) - tady se vyska meri jen JEDNOU pri startu a
  // pri otoceni obrazovky, NIKDY na obycejny 'resize' (ten se spousti
  // i pri otevreni klavesnice a delal by presne ty stare problemy).
  //
  // POZNAMKA: byl tu kratce pokus o opakovane premereni (hned + rAF +
  // timeouty + visibilitychange), aby se odchytil pripad, kdy prvni
  // zmereni vyjde moc velke po navratu z pozadi. Ukazalo se ale, ze to
  // zpusobilo presne opacny problem - jedno z pozdejsich premereni
  // obcas chytlo MENSI cislo nez skutecna vyska a --app-vh se zmensil,
  // takze se spodek appky prestal dotahovat dolu (puvodni bug se
  // vratil v jine podobe). Jedno cisté zmereni pri startu se v praxi
  // ukazalo jako spolehlivejsi nez opakovane hadani - pokud se tenhle
  // problem znovu objevi, resit ho jinak nez pridavanim dalsich
  // remeasure pokusu.
  (function(){
    function setAppVh(){
      document.documentElement.style.setProperty('--app-vh', window.innerHeight + 'px');
    }
    setAppVh();
    window.addEventListener('orientationchange', function(){ setTimeout(setAppVh, 250); });
    window.addEventListener('pageshow', setAppVh);
  })();
</script>
</head>
<body>

<!--
  UVODNI OBRAZOVKA (14.8.2026): appka pri vetsim mnozstvi dat (stovky
  fotek) nekolik vterin necinne cekala - viz msHydrateBlobCache()
  v main.js, ktera pri startu natahuje nahledy vsech fotek/dokumentu
  z IndexedDB, driv nez appka vykresli prvni obrazovku. Do te doby
  clovek koukal na prazdno.
  Tenhle blok ma VLASTNI inline styl (nespoleha na app.css, ktery se
  jeste nemusi stihnout nacist) a vykresli se OKAMZITE, driv nez se
  spusti jediny radek JS. Barva pozadi (#050f1a) je prevzata primo
  z dodaneho loga MJ Production, at kolem obrazku neni viditelny svar.
  Postup dole je NAPOJENY NA SKUTECNE NACITANI (main.js volá
  window.__msSplashProgress), ne na predstiranou animaci - viz zasady
  appky o poctivem zobrazovani prubehu.
-->
<div id="ms-splash" style="position:fixed;inset:0;z-index:999;background:#050f1a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .35s ease">
  <img src="mj-production-logo.png" width="132" height="132" alt="" style="width:132px;height:132px;filter:drop-shadow(0 0 18px rgba(255,155,50,.18))"/>
  <div style="text-align:center">
    <div style="font-family:Georgia,'Times New Roman',serif;font-size:20px;letter-spacing:.04em;color:#f0ebe3">Moje Stavba</div>
    <div style="font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:#7b8494;margin-top:5px">MJ Production</div>
  </div>
  <div style="width:148px;height:3px;background:rgba(255,255,255,.09);overflow:hidden;margin-top:6px">
    <div id="ms-splash-bar" style="height:100%;width:6%;background:#ff9b32;transition:width .25s ease"></div>
  </div>
  <div id="ms-splash-label" style="font-size:10px;color:#5c6474;letter-spacing:.02em">Spouštím…</div>
  <!-- DOPLNENO (14.8.2026): MS_BUILD_VERSION jeste neexistuje v tomhle
       miste souboru (definuje se az v data.js, nacitanem mnohem pozdeji) -
       prazdne misto se doplni z main.js, hned na zacatku jeho behu, driv
       nez cokoliv asynchronniho - pri minimalni dobe zobrazeni splashe
       (3 vteriny) je na to spolehlive dost casu. -->
  <div id="ms-splash-version" style="font-size:8px;color:#3d4350;letter-spacing:.04em;margin-top:2px"></div>
</div>
<script>
  // Male globalni rozhrani, kterym main.js hlasi skutecny prubeh -
  // definovano tady (ne az v main.js), at je pripravene driv, nez
  // main.js poprve zavola.
  window.__msSplashStartedAt = Date.now();
  // (14.8.2026) Na rychlem telefonu s malo daty appka nastartuje tak
  // rychle, ze logo bylo videt jen jako bliknuti - MINIMALNI_DOBA
  // zarucuje, ze zustane videt aspon tuhle chvili, i kdyz je appka
  // hotova driv. Kdyz start trva DELE (skutecne velky projekt, pomala
  // sit), zadne umele cekani navic nepridava - jen dorovnava rozdil
  // do minima, nikdy nezpomaluje uz tak pomaly start.
  var MINIMALNI_DOBA_SPLASH = 3000;
  window.__msSplashProgress = function(hotovo, celkem, popisek){
    var bar = document.getElementById('ms-splash-bar');
    var lbl = document.getElementById('ms-splash-label');
    if(!bar || !lbl) return;
    if(celkem > 0){
      var pct = Math.max(6, Math.round((hotovo / celkem) * 100));
      bar.style.width = pct + '%';
    }
    if(popisek) lbl.textContent = popisek;
  };
  window.__msSplashDone = function(){
    var el = document.getElementById('ms-splash');
    if(!el) return;
    var uplynulo = Date.now() - window.__msSplashStartedAt;
    var zbyva = Math.max(0, MINIMALNI_DOBA_SPLASH - uplynulo);
    setTimeout(function(){
      el.style.opacity = '0';
      setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 380);
    }, zbyva);
  };
  // POJISTKA (14.8.2026): kdyby cokoliv v hlavni boot sekvenci appky
  // (main.js) spadlo driv, nez stihne zavolat __msSplashDone(), tenhle
  // pomeznik ji po 8 vterinach schova sam - lepsi rozbita appka za
  // splashem nez navzdy zaseknuta nacitaci obrazovka, ktera clovek
  // nemuze nijak obejit. (Nezavisi na MINIMALNI_DOBA_SPLASH vyse -
  // 8 vterin uz je vic nez dost, zadne dalsi cekani se nepricita.)
  setTimeout(function(){
    if(typeof window.__msSplashDone === 'function') window.__msSplashDone();
  }, 8000);
</script>
